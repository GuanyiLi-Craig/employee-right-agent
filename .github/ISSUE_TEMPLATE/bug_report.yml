name: Bug report
description: Something behaves differently from what the README or a test claims.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Most of this project's failure modes are meant to produce a *legible*
        error that names the command which fixes them. If you got one of those
        and it was wrong or unhelpful, that is a bug worth reporting too.

        For a security issue, do not use this form — see
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
      placeholder: |
        $ uv run rights-ask "..."
        ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The shortest sequence of commands from a fresh clone.
      placeholder: |
        1. uv sync --group dev
        2. uv run rights-ingest --no-onnx
        3. ...
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: "Output of `git rev-parse --short HEAD`."
    validations:
      required: true

  - type: dropdown
    id: how-run
    attributes:
      label: How were you running it
      options:
        - Local (uv run)
        - Docker Compose
        - CI
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        OS and Python version, plus the settings that differ from the defaults.
        `RIGHTS_MODEL`, `RIGHTS_EMBEDDER` and `RIGHTS_CORPUS` are the three that
        explain most surprises.
      placeholder: |
        macOS 15.2, Python 3.12.4
        RIGHTS_MODEL=stub-local
        RIGHTS_EMBEDDER=hashing
        RIGHTS_CORPUS=(unset)
    validations:
      required: true

  - type: textarea
    id: manifest
    attributes:
      label: Index manifest (if the problem involves retrieval)
      description: "Contents of `runs/index_manifest.json`. Pasting it rules out a stale or mismatched index, which is the most common cause."
      render: json
    validations:
      required: false
